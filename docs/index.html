<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Character AR Cards</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #container { position: fixed; inset: 0; }
  #container video, #container canvas { object-fit: cover; }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.82); color: #fff; text-align: center; padding: 24px; box-sizing: border-box;
  }
  #overlay h1 { font-size: 22px; margin: 0 0 12px; }
  #overlay p { font-size: 15px; line-height: 1.5; opacity: 0.85; max-width: 320px; margin: 0 0 24px; }
  #startBtn {
    background: #fff; color: #000; border: none; border-radius: 999px;
    padding: 14px 32px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  #startBtn:active { transform: scale(0.97); }
  .hidden { display: none !important; }

  #hint {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: center; padding-top: max(20px, env(safe-area-inset-top));
    pointer-events: none;
  }
  #hint span {
    background: rgba(0,0,0,0.55); color: #fff; font-size: 13px;
    padding: 8px 16px; border-radius: 999px; transition: opacity 0.3s;
  }

  #errorBox {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,0.9);
    color: #fff; text-align: center; padding: 24px; box-sizing: border-box;
  }
</style>
</head>
<body>

<div id="container"></div>

<div id="hint" class="hidden">
  <span id="hintText">Point your camera at a card</span>
</div>

<div id="overlay">
  <h1>Character AR Cards</h1>
  <p>Tap start, allow camera access, then point your phone at one of the printed cards to bring its character to life.</p>
  <button id="startBtn">Start</button>
</div>

<div id="errorBox">
  <div>
    <p id="errorText">Something went wrong.</p>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';

  const manifestRes = await fetch('./manifest.json');
  const manifest = await manifestRes.json();

  const container = document.getElementById('container');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const hint = document.getElementById('hint');
  const hintText = document.getElementById('hintText');
  const errorBox = document.getElementById('errorBox');
  const errorText = document.getElementById('errorText');

  function showError(message) {
    errorText.textContent = message;
    errorBox.style.display = 'flex';
  }

  const mindarThree = new MindARThree({
    container,
    imageTargetSrc: './targets.mind',
    maxTrack: manifest.length,
  });
  const { renderer, scene, camera } = mindarThree;

  const videos = [];

  manifest.forEach((entry, index) => {
    const video = document.createElement('video');
    video.src = entry.video;
    video.loop = true;
    video.muted = false;
    video.playsInline = true;
    video.setAttribute('webkit-playsinline', 'true');
    video.crossOrigin = 'anonymous';
    video.preload = 'auto';
    videos.push(video);

    const texture = new THREE.VideoTexture(video);
    texture.colorSpace = THREE.SRGBColorSpace;

    const aspect = entry.height / entry.width;
    const planeAspect = entry.width / entry.height;
    const geometry = new THREE.PlaneGeometry(1, aspect);
    const material = new THREE.MeshBasicMaterial({ map: texture, toneMapped: false });
    const plane = new THREE.Mesh(geometry, material);

    // Cover-fit the video into the card's shape (like CSS object-fit: cover),
    // since source videos don't all share the same aspect ratio as the printed card.
    video.addEventListener('loadedmetadata', () => {
      const videoAspect = video.videoWidth / video.videoHeight;
      if (videoAspect > planeAspect) {
        texture.repeat.set(planeAspect / videoAspect, 1);
        texture.offset.set((1 - texture.repeat.x) / 2, 0);
      } else {
        texture.repeat.set(1, videoAspect / planeAspect);
        texture.offset.set(0, (1 - texture.repeat.y) / 2);
      }
    });

    const anchor = mindarThree.addAnchor(index);
    anchor.group.add(plane);

    anchor.onTargetFound = () => {
      hint.classList.add('hidden');
      video.currentTime = 0;
      video.play().catch(() => {});
    };
    anchor.onTargetLost = () => {
      video.pause();
      hint.classList.remove('hidden');
    };
  });

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.textContent = 'Starting…';
    try {
      // Unlock audio-capable playback on iOS Safari with a user-gesture-tied play/pause.
      // Fire every play() synchronously in this same tick — awaiting them one at a time
      // burns through the gesture's activation window, so later videos in the list
      // would stop counting as "user-initiated" and silently fail to autoplay.
      videos.forEach((video) => {
        video.play().then(() => {
          video.pause();
          video.currentTime = 0;
        }).catch(() => { /* ignore — will retry on target found */ });
      });

      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });

      overlay.style.display = 'none';
      hint.classList.remove('hidden');
    } catch (err) {
      console.error(err);
      showError('Could not start the camera. Please allow camera access and reload the page.');
    }
  });
</script>

</body>
</html>

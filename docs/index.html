<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Off the Page</title>
<meta name="description" content="Motion design outcomes in augmented reality — a showcase of student work from the Associate Degree in Graphic Design, Brunswick." />

<!--
  Aglet Mono (XYZ Type), matching the print cards, served from this account's
  Adobe Fonts web project — regular (400) and bold (700). Preconnect first so
  the font request doesn't wait on a cold DNS/TLS handshake. If the Creative
  Cloud subscription ever lapses this stops resolving and the page falls back
  to the system monospace face in the --mono stack rather than breaking.
-->
<link rel="preconnect" href="https://use.typekit.net" crossorigin />
<link rel="preconnect" href="https://p.typekit.net" crossorigin />
<link rel="stylesheet" href="https://use.typekit.net/ece5gtw.css" />

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    /* 'aglet-mono' is the Adobe Fonts family name and only resolves once a
       web project kit is linked in the head; everything after it is the
       system monospace stack standing in until then. */
    --mono: 'aglet-mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace;
  }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: var(--mono); }
  #container { position: fixed; inset: 0; }
  #container video, #container canvas { object-fit: cover; }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.82); color: #fff; text-align: center; padding: 24px; box-sizing: border-box;
  }
  #overlay h1 {
    font-size: 34px; line-height: 1.1; font-weight: 700;
    letter-spacing: -0.02em; margin: 0 0 18px;
  }
  #overlay .lede {
    font-size: 14px; line-height: 1.65; opacity: 0.82;
    max-width: 330px; margin: 0 0 22px;
  }
  #overlay .instruction {
    font-size: 12.5px; line-height: 1.6; opacity: 0.5;
    max-width: 300px; margin: 0 0 28px;
  }
  #overlay .alt {
    font-size: 12.5px; margin: 20px 0 0; opacity: 0.55;
  }
  #overlay .credit {
    font-size: 12.5px; margin: 14px 0 0; opacity: 0.5;
  }
  #overlay .alt a,
  #overlay .credit a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.25); padding-bottom: 1px; }
  #startBtn {
    background: #fff; color: #000; border: none; border-radius: 999px;
    font-family: inherit; letter-spacing: -0.01em;
    padding: 14px 34px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  #startBtn:active { transform: scale(0.97); }
  .hidden { display: none !important; }

  #hint {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: center; padding-top: max(20px, env(safe-area-inset-top));
    pointer-events: none;
  }
  #hint span {
    background: rgba(0,0,0,0.55); color: #fff; font-size: 13px;
    padding: 8px 16px; border-radius: 999px; transition: opacity 0.3s;
  }

  #preloadStatus {
    font-size: 12px; opacity: 0.55; margin: 18px 0 0; min-height: 16px;
  }

  /* Full-screen message used for anything that stops the experience:
     unsupported browser, in-app webview, blocked camera. */
  #blocker {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center;
    background: #0d0d0f; color: #fff; padding: 28px; box-sizing: border-box;
    overflow-y: auto;
  }
  #blocker.show { display: flex; }
  #blocker .panel { max-width: 340px; text-align: left; }
  #blocker h2 { font-size: 19px; margin: 0 0 12px; line-height: 1.3; }
  #blocker p { font-size: 14.5px; line-height: 1.6; opacity: 0.8; margin: 0 0 14px; }
  #blocker ol { font-size: 14.5px; line-height: 1.7; opacity: 0.8; margin: 0 0 16px; padding-left: 20px; }
  #blocker li { margin-bottom: 4px; }
  #blocker .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  #blocker button {
    background: #fff; color: #000; border: none; border-radius: 999px;
    padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #blocker button.secondary { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); }
  #blocker button:active { transform: scale(0.97); }
  #blocker .url {
    font-size: 12.5px; opacity: 0.6; word-break: break-all;
    background: rgba(255,255,255,0.07); padding: 10px 12px; border-radius: 8px; margin-bottom: 4px;
  }
</style>
</head>
<body>

<div id="container"></div>

<div id="hint" class="hidden">
  <span id="hintText">Point your camera at a card</span>
</div>

<div id="overlay">
  <h1>Off the Page</h1>
  <p class="lede">Motion design outcomes in augmented reality — a showcase of student work from the Associate Degree in Graphic Design, Brunswick.</p>
  <p class="instruction">Tap start and allow camera access, then point your phone at a card.</p>
  <button id="startBtn">Start</button>
  <p id="preloadStatus"></p>
  <p class="alt"><a href="./watch.html">No card with you? Just watch the videos</a></p>
  <p class="credit"><a href="https://www.instagram.com/rmit_gd/" target="_blank" rel="noopener">@rmit_gd</a></p>
</div>

<div id="blocker">
  <div class="panel">
    <h2 id="blockerTitle"></h2>
    <div id="blockerBody"></div>
    <div class="actions" id="blockerActions"></div>
  </div>
</div>

<script>
/*
 * Deliberately a classic script, not a module: browsers too old to understand
 * the import map below never execute the module at all, which would otherwise
 * leave them staring at a Start button that silently does nothing. This runs
 * everywhere, so it can explain the problem instead.
 */
(function () {
  var UA = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(UA) ||
              (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(UA);

  // Order matters: Samsung Internet and Edge both carry "Chrome" in their user
  // agent, so naming the wrong app would send people to the wrong settings screen.
  var browser = 'your browser';
  if (/SamsungBrowser/.test(UA)) browser = 'Samsung Internet';
  else if (/EdgiOS|EdgA|Edg\//.test(UA)) browser = 'Edge';
  else if (/FxiOS|Firefox/.test(UA)) browser = 'Firefox';
  else if (/CriOS|Chrome/.test(UA)) browser = 'Chrome';
  else if (isIOS) browser = 'Safari';

  // Apps that open links in their own embedded webview, where camera access is
  // often unavailable regardless of the phone's settings.
  var inAppBrowser = /Instagram|FBAN|FBAV|FB_IAB|LinkedInApp|Snapchat|Twitter|MicroMessenger|BytedanceWebview|musical_ly|TikTok|Line\/|Pinterest/i.test(UA);

  var iosVersion = null;
  var m = UA.match(/OS (\d+)[_.](\d+)/);
  if (isIOS && m) iosVersion = m[1] + '.' + m[2];

  var el = function (id) { return document.getElementById(id); };
  var shown = false;

  function show(opts) {
    shown = true;
    el('blockerTitle').textContent = opts.title;
    el('blockerBody').innerHTML = opts.body;
    var actions = el('blockerActions');
    actions.innerHTML = '';
    (opts.actions || []).forEach(function (a) {
      var b = document.createElement('button');
      b.textContent = a.label;
      if (a.secondary) b.className = 'secondary';
      b.addEventListener('click', a.onClick);
      actions.appendChild(b);
    });
    // Whatever went wrong, the videos themselves can still be watched — the
    // gallery deliberately avoids everything that might have failed here.
    var watch = document.createElement('button');
    watch.textContent = 'Just watch the videos';
    watch.className = 'secondary';
    watch.addEventListener('click', function () { location.href = './watch.html'; });
    actions.appendChild(watch);
    el('blocker').classList.add('show');
  }

  function hide() { el('blocker').classList.remove('show'); }

  var reloadAction = { label: 'Reload', onClick: function () { location.reload(); } };

  // Where to send someone whose camera permission is switched off. The wording
  // differs enough per platform that a generic "check your settings" is useless.
  function cameraSteps() {
    if (isIOS && browser === 'Chrome') {
      return '<ol><li>Open the iPhone <b>Settings</b> app</li>' +
             '<li>Scroll down and tap <b>Chrome</b></li>' +
             '<li>Turn on <b>Camera</b></li>' +
             '<li>Come back here and tap Reload</li></ol>';
    }
    if (isIOS) {
      return '<ol><li>Open the iPhone <b>Settings</b> app</li>' +
             '<li>Tap <b>Apps</b> → <b>Safari</b> (or scroll to <b>Safari</b>)</li>' +
             '<li>Tap <b>Camera</b> and choose <b>Allow</b></li>' +
             '<li>Come back here and tap Reload</li></ol>' +
             '<p>You can also tap <b>aA</b> in the address bar → <b>Website Settings</b> → <b>Camera</b> → <b>Allow</b>.</p>';
    }
    if (isAndroid) {
      return '<ol><li>Tap the <b>lock icon</b> next to the web address</li>' +
             '<li>Tap <b>Permissions</b> (or <b>Site settings</b>)</li>' +
             '<li>Set <b>Camera</b> to <b>Allow</b></li>' +
             '<li>Come back here and tap Reload</li></ol>';
    }
    return '<p>Allow camera access for this page in your browser settings, then reload.</p>';
  }

  // Shared with the module so both layers report problems the same way.
  window.ARFallback = {
    isIOS: isIOS,
    isAndroid: isAndroid,
    browser: browser,
    show: show,
    hide: hide,
    cameraSteps: cameraSteps,
    reloadAction: reloadAction,
    wasShown: function () { return shown; }
  };

  // --- capability checks -------------------------------------------------
  var hasImportMap = !!(window.HTMLScriptElement &&
                        HTMLScriptElement.supports &&
                        HTMLScriptElement.supports('importmap'));
  var hasCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  var hasWebGL = (function () {
    try {
      var c = document.createElement('canvas');
      return !!(c.getContext('webgl2') || c.getContext('webgl'));
    } catch (e) { return false; }
  })();
  var isSecure = window.isSecureContext !== false;

  if (!isSecure) {
    show({
      title: 'This page must be opened securely',
      body: '<p>Cameras only work over a secure (https) connection. Open the ' +
            'link again starting with <b>https://</b>.</p>',
      actions: [reloadAction]
    });
    return;
  }

  if (inAppBrowser) {
    show({
      title: 'Open this in ' + (isIOS ? 'Safari' : 'Chrome'),
      body: '<p>You\'ve opened this inside another app\'s built-in browser, ' +
            'which usually can\'t use the camera.</p>' +
            '<p>Tap the <b>⋯</b> or <b>share</b> icon and choose ' +
            '<b>Open in ' + (isIOS ? 'Safari' : 'Chrome') + '</b>, or copy the ' +
            'link below and paste it into your browser.</p>' +
            '<div class="url">' + location.href + '</div>',
      actions: [
        {
          label: 'Copy link',
          onClick: function (e) {
            var done = function () { e.target.textContent = 'Copied'; };
            if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, done);
            else done();
          }
        },
        { label: 'Try anyway', secondary: true, onClick: hide }
      ]
    });
    return;
  }

  if (!hasImportMap || !hasCamera || !hasWebGL) {
    var reason = !hasCamera
      ? 'This browser can\'t give web pages access to the camera.'
      : (!hasWebGL
        ? 'This device\'s browser is missing the graphics support (WebGL) the experience needs.'
        : 'This browser is a few versions too old to run the experience.');
    show({
      title: 'Sorry — this phone isn\'t supported',
      body: '<p>' + reason + '</p>' +
            (isIOS
              ? '<p>It needs <b>iOS 16.4 or newer</b>' +
                (iosVersion ? ' — this device reports <b>iOS ' + iosVersion + '</b>' : '') +
                '. Updating iOS in <b>Settings → General → Software Update</b> should fix it.</p>'
              : '<p>Updating ' + browser + ' to the latest version should fix it.</p>') +
            '<p>The cards still work on another, more recent phone.</p>',
      actions: [reloadAction]
    });
    return;
  }

  // Nothing obvious is wrong, but the module may still fail to load (CDN
  // blocked by a network, for example). Don't leave Start looking functional.
  setTimeout(function () {
    if (!window.__arModuleLoaded && !shown) {
      show({
        title: 'Couldn\'t load the experience',
        body: '<p>Part of the experience failed to download. This is usually a ' +
              'flaky connection, or a network that blocks parts of the web.</p>' +
              '<p>Try again on mobile data or a different Wi-Fi network.</p>',
        actions: [reloadAction]
      });
    }
  }, 12000);
})();
</script>

<script type="module">
  import * as THREE from 'three';
  import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';

  // Reaching here proves the import map resolved and the CDN answered, which
  // is what the fallback script's watchdog is waiting to see.
  window.__arModuleLoaded = true;

  const fallback = window.ARFallback;

  const manifestRes = await fetch('./manifest.json');
  const manifest = await manifestRes.json();

  const container = document.getElementById('container');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const hint = document.getElementById('hint');
  const hintText = document.getElementById('hintText');
  const preloadStatus = document.getElementById('preloadStatus');

  // Warm the browser cache for targets.mind while the intro is still on screen.
  // It's the largest thing a visitor has to download and nothing can track
  // until it has arrived, so overlapping it with reading is most of the win.
  (async () => {
    try {
      const res = await fetch('./targets.mind');
      const total = Number(res.headers.get('content-length')) || 0;
      if (!res.body || !total) { await res.arrayBuffer(); return; }
      const reader = res.body.getReader();
      let received = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        received += value.length;
        preloadStatus.textContent = 'Preparing… ' + Math.round((received / total) * 100) + '%';
      }
      preloadStatus.textContent = '';
    } catch (e) {
      preloadStatus.textContent = ''; // harmless: MindAR will fetch it itself
    }
  })();

  // MindAR throws away the original getUserMedia error, but "blocked in
  // settings" and "no camera" need completely different advice — so ask for
  // the camera here first, where the real error is still visible.
  async function ensureCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false,
    });
    stream.getTracks().forEach((t) => t.stop()); // MindAR opens its own stream
  }

  function reportCameraProblem(err) {
    const name = (err && err.name) || '';
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
      fallback.show({
        title: 'Camera access is turned off',
        body: '<p>The experience needs your camera to see the card. ' +
              'It looks like camera access is switched off for ' + fallback.browser + '.</p>' +
              fallback.cameraSteps(),
        actions: [fallback.reloadAction],
      });
    } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
      fallback.show({
        title: 'No camera found',
        body: '<p>This device doesn\'t seem to have a camera available. ' +
              'Try again on a phone or tablet.</p>',
        actions: [fallback.reloadAction],
      });
    } else if (name === 'NotReadableError' || name === 'TrackStartError') {
      fallback.show({
        title: 'The camera is busy',
        body: '<p>Another app is using the camera. Close it — the camera app ' +
              'or a video call is the usual culprit — then tap Reload.</p>',
        actions: [fallback.reloadAction],
      });
    } else {
      fallback.show({
        title: 'Couldn\'t start the camera',
        body: '<p>Something stopped the camera from starting' +
              (name ? ' (' + name + ')' : '') + '.</p>' +
              '<p>Reloading usually clears it. If it keeps happening, try ' +
              'opening the link in ' + (fallback.isIOS ? 'Safari' : 'Chrome') + '.</p>',
        actions: [fallback.reloadAction],
      });
    }
  }

  const mindarThree = new MindARThree({
    container,
    imageTargetSrc: './targets.mind',
    // Only one card is ever held up at a time. Tracking every target at once
    // costs work per frame for no benefit.
    maxTrack: 1,
  });
  const { renderer, scene, camera } = mindarThree;

  // One shared video element for the whole set. Giving each card its own
  // element made the browser fetch every video on page load; with one element
  // whose src is set on scan, only the card actually being looked at downloads.
  const video = document.createElement('video');
  video.loop = true;
  video.muted = false;
  video.playsInline = true;
  video.setAttribute('webkit-playsinline', 'true');
  video.preload = 'none';

  const texture = new THREE.VideoTexture(video);
  texture.colorSpace = THREE.SRGBColorSpace;
  const material = new THREE.MeshBasicMaterial({ map: texture, toneMapped: false });

  // 0.1s of silent black video, inlined so the gesture unlock needs no network.
  const UNLOCK_CLIP = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAVqbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAAGQAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwAAAj90cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAAGQAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAABAAAAAQAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAABkAAAAAAABAAAAAAG3bWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAAAoAAAABABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABYm1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAASJzdGJsAAAAvnN0c2QAAAAAAAAAAQAAAK5hdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAABAAEABIAAAASAAAAAAAAAABFUxhdmM2Mi4yOC4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAANGF2Y0MBZAAK/+EAF2dkAAqs2V7ARAAAAwAEAAADAFA8SJZYAQAGaOvgZSyL/fj4AAAAABBwYXNwAAAAAQAAAAEAAAAUYnRydAAAAAAAANygAAAAAAAAABhzdHRzAAAAAAAAAAEAAAABAAAEAAAAABxzdHNjAAAAAAAAAAEAAAABAAAAAQAAAAEAAAAUc3RzegAAAAAAAALCAAAAAQAAABRzdGNvAAAAAAAAAAEAAAWvAAACVXRyYWsAAABcdGtoZAAAAAMAAAAAAAAAAAAAAAIAAAAAAAAAXQAAAAAAAAAAAAAAAQEAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAACRlZHRzAAAAHGVsc3QAAAAAAAAAAQAAAF0AAAQAAAEAAAAAAc1tZGlhAAAAIG1kaGQAAAAAAAAAAAAAAAAAAKxEAAAUAFXEAAAAAAAtaGRscgAAAAAAAAAAc291bgAAAAAAAAAAAAAAAFNvdW5kSGFuZGxlcgAAAAF4bWluZgAAABBzbWhkAAAAAAAAAAAAAAAkZGluZgAAABxkcmVmAAAAAAAAAAEAAAAMdXJsIAAAAAEAAAE8c3RibAAAAH5zdHNkAAAAAAAAAAEAAABubXA0YQAAAAAAAAABAAAAAAAAAAAAAQAQAAAAAKxEAAAAAAA2ZXNkcwAAAAADgICAJQACAASAgIAXQBUAAAAAAB9AAAAJ9QWAgIAFEghW5QAGgICAAQIAAAAUYnRydAAAAAAAAB9AAAAJ9QAAABhzdHRzAAAAAAAAAAEAAAAFAAAEAAAAAChzdHNjAAAAAAAAAAIAAAABAAAAAQAAAAEAAAACAAAABAAAAAEAAAAoc3RzegAAAAAAAAAAAAAABQAAABUAAAAEAAAABAAAAAQAAAAEAAAAGHN0Y28AAAAAAAAAAgAABZoAAAhxAAAAGnNncGQBAAAAcm9sbAAAAAIAAAAB//8AAAAcc2JncAAAAAByb2xsAAAAAQAAAAUAAAABAAAAYnVkdGEAAABabWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAbWRpcmFwcGwAAAAAAAAAAAAAAAAtaWxzdAAAACWpdG9vAAAAHWRhdGEAAAABAAAAAExhdmY2Mi4xMi4xMDIAAAAIZnJlZQAAAu9tZGF03gIATGF2YzYyLjI4LjEwMgACMEAOAAACrgYF//+q3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE2NSByMzIyMiBiMzU2MDVhIC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAyNSAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbCAtIG9wdGlvbnM6IGNhYmFjPTEgcmVmPTMgZGVibG9jaz0xOjA6MCBhbmFseXNlPTB4MzoweDExMyBtZT1oZXggc3VibWU9NyBwc3k9MSBwc3lfcmQ9MS4wMDowLjAwIG1peGVkX3JlZj0xIG1lX3JhbmdlPTE2IGNocm9tYV9tZT0xIHRyZWxsaXM9MSA4eDhkY3Q9MSBjcW09MCBkZWFkem9uZT0yMSwxMSBmYXN0X3Bza2lwPTEgY2hyb21hX3FwX29mZnNldD0tMiB0aHJlYWRzPTEgbG9va2FoZWFkX3RocmVhZHM9MSBzbGljZWRfdGhyZWFkcz0wIG5yPTAgZGVjaW1hdGU9MSBpbnRlcmxhY2VkPTAgYmx1cmF5X2NvbXBhdD0wIGNvbnN0cmFpbmVkX2ludHJhPTAgYmZyYW1lcz0zIGJfcHlyYW1pZD0yIGJfYWRhcHQ9MSBiX2JpYXM9MCBkaXJlY3Q9MSB3ZWlnaHRiPTEgb3Blbl9nb3A9MCB3ZWlnaHRwPTIga2V5aW50PTI1MCBrZXlpbnRfbWluPTEwIHNjZW5lY3V0PTQwIGludHJhX3JlZnJlc2g9MCByY19sb29rYWhlYWQ9NDAgcmM9Y3JmIG1idHJlZT0xIGNyZj01MS4wIHFjb21wPTAuNjAgcXBtaW49MCBxcG1heD02OSBxcHN0ZXA9NCBpcF9yYXRpbz0xLjQwIGFxPTE6MS4wMACAAAAADGWIhAAv//Bj8CbQYQEYIAcBGCAHARggBwEYIAc=';

  const HINT_DEFAULT = hintText.textContent;
  let activeIndex = -1;

  // Cover-fit the video into the card's shape (like CSS object-fit: cover),
  // since a video needn't share the aspect ratio of the card it's anchored to.
  const fitToCard = (entry) => {
    const planeAspect = entry.width / entry.height;
    const videoAspect = video.videoWidth / video.videoHeight;
    if (!videoAspect) return;
    if (videoAspect > planeAspect) {
      texture.repeat.set(planeAspect / videoAspect, 1);
      texture.offset.set((1 - texture.repeat.x) / 2, 0);
    } else {
      texture.repeat.set(1, videoAspect / planeAspect);
      texture.offset.set(0, (1 - texture.repeat.y) / 2);
    }
  };

  video.addEventListener('loadedmetadata', () => {
    if (activeIndex >= 0) fitToCard(manifest[activeIndex]);
  });

  // A card's video is fetched the first time it's scanned, so give the viewer
  // something to read during that wait instead of an empty card.
  video.addEventListener('waiting', () => {
    hintText.textContent = 'Loading…';
    hint.classList.remove('hidden');
  });
  video.addEventListener('playing', () => {
    hint.classList.add('hidden');
  });

  manifest.forEach((entry, index) => {
    const geometry = new THREE.PlaneGeometry(1, entry.height / entry.width);
    const plane = new THREE.Mesh(geometry, material);

    const anchor = mindarThree.addAnchor(index);
    anchor.group.add(plane);

    anchor.onTargetFound = () => {
      hint.classList.add('hidden');
      activeIndex = index;
      if (video.src.endsWith(entry.video)) {
        video.currentTime = 0; // same card again — replay from the top
      } else {
        // Re-pointing src starts the download for this card only, and a fresh
        // source begins at 0 on its own (seeking before it loads would throw).
        video.src = entry.video;
      }
      fitToCard(entry);
      video.play().catch(() => {});
    };
    anchor.onTargetLost = () => {
      if (activeIndex === index) video.pause();
      hintText.textContent = HINT_DEFAULT;
      hint.classList.remove('hidden');
    };
  });

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.textContent = 'Starting…';

    // Unlock audio-capable playback on iOS Safari: the element has to be
    // played once inside a user gesture before it may play on its own later.
    // Use a tiny inlined silent clip so unlocking costs no real download.
    // This must happen before any await, or the gesture no longer counts.
    video.src = UNLOCK_CLIP;
    try {
      await video.play();
      video.pause();
    } catch (e) { /* ignore — playback is retried on target found */ }

    try {
      await ensureCamera();
    } catch (err) {
      console.error(err);
      reportCameraProblem(err);
      return;
    }

    try {
      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });

      overlay.style.display = 'none';
      hint.classList.remove('hidden');
    } catch (err) {
      console.error(err);
      fallback.show({
        title: 'Couldn\'t start the experience',
        body: '<p>The camera worked, but the card tracking failed to start. ' +
              'This is usually a temporary download problem.</p>',
        actions: [fallback.reloadAction],
      });
    }
  });
</script>

</body>
</html>

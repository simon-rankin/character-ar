<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Off the Page — Watch</title>
<meta name="description" content="Motion design outcomes from the Associate Degree in Graphic Design, Brunswick." />

<link rel="preconnect" href="https://use.typekit.net" crossorigin />
<link rel="preconnect" href="https://p.typekit.net" crossorigin />
<link rel="stylesheet" href="https://use.typekit.net/ece5gtw.css" />

<!--
  This page is the fallback for devices that can't run the AR experience, so it
  deliberately avoids everything index.html relies on: no ES modules, no import
  map, no three.js, no MindAR. Plain markup, a plain <video> tag and ES5-era
  JavaScript, because the browsers landing here are exactly the ones that
  choked on the main page.
-->
<style>
  :root {
    --mono: 'aglet-mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace;
    --bg: #000;
    --fg: #fff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: var(--mono); -webkit-text-size-adjust: 100%;
  }

  header {
    padding: calc(28px + env(safe-area-inset-top)) 20px 8px;
    max-width: 900px; margin: 0 auto;
  }
  header h1 { font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 10px; }
  header p { font-size: 13px; line-height: 1.6; opacity: 0.7; margin: 0 0 14px; max-width: 460px; }
  header .back { display: inline-block; font-size: 12.5px; opacity: 0.65; color: inherit; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.28); padding-bottom: 1px; }

  #grid {
    display: grid; gap: 10px; padding: 14px 20px calc(40px + env(safe-area-inset-bottom));
    grid-template-columns: repeat(2, 1fr); max-width: 900px; margin: 0 auto;
  }
  @media (min-width: 560px) { #grid { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
  @media (min-width: 800px) { #grid { grid-template-columns: repeat(4, 1fr); } }

  .tile {
    position: relative; display: block; width: 100%; padding: 0; border: 0;
    background: #131316; border-radius: 10px; overflow: hidden; cursor: pointer;
    font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent;
    /* Keeps dark-background stills from disappearing into the page. */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09);
  }
  /* Percentage padding rather than aspect-ratio: the whole point of this page
     is the browsers that are behind, and this trick works in all of them.
     A uniform 9:16 frame also stops mixed source ratios tearing holes in the grid. */
  .tile .frame { display: block; position: relative; width: 100%; padding-top: 177.78%; overflow: hidden; }
  .tile img {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: block; object-fit: cover;
  }
  .tile:active { transform: scale(0.985); }
  .tile .play {
    position: absolute; left: 8px; bottom: 8px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center;
  }
  .tile .play svg { width: 11px; height: 11px; margin-left: 2px; fill: #fff; }
  .tile .label {
    position: absolute; right: 8px; bottom: 10px;
    font-size: 10.5px; letter-spacing: 0.02em;
    background: rgba(0,0,0,0.55); padding: 4px 8px; border-radius: 999px;
  }

  #status { padding: 40px 20px; text-align: center; font-size: 13.5px; opacity: 0.7; line-height: 1.6; }

  /* Player */
  #player {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(0,0,0,0.94);
    align-items: center; justify-content: center; padding: 16px;
  }
  #player.show { display: flex; }
  #player video {
    max-width: 100%; max-height: 82vh; width: auto; border-radius: 8px;
    background: #000; outline: none;
  }
  #closeBtn {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px;
    background: rgba(255,255,255,0.14); color: #fff; border: 0; border-radius: 999px;
    width: 40px; height: 40px; font-size: 20px; line-height: 1; cursor: pointer;
    font-family: inherit;
  }
  #playerLabel {
    position: absolute; left: 0; right: 0;
    bottom: calc(18px + env(safe-area-inset-bottom));
    text-align: center; font-size: 12.5px; opacity: 0.65;
  }
</style>
</head>
<body>

<header>
  <h1>Off the Page</h1>
  <p>Motion design outcomes from the Associate Degree in Graphic Design, Brunswick. Tap any thumbnail to play.</p>
  <a class="back" href="./index.html">← Try the AR experience</a>
</header>

<div id="status">Loading…</div>
<div id="grid"></div>

<div id="player">
  <button id="closeBtn" aria-label="Close">×</button>
  <video id="playerVideo" controls playsinline webkit-playsinline preload="metadata"></video>
  <div id="playerLabel"></div>
</div>

<script>
(function () {
  var grid = document.getElementById('grid');
  var status = document.getElementById('status');
  var player = document.getElementById('player');
  var playerVideo = document.getElementById('playerVideo');
  var playerLabel = document.getElementById('playerLabel');
  var closeBtn = document.getElementById('closeBtn');

  var PLAY_ICON = '<svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg>';

  function openPlayer(item) {
    playerVideo.src = item.video;
    playerLabel.textContent = item.label;
    player.className = 'show';
    // Autoplay may be refused without a gesture on some browsers; this call is
    // inside the tap handler, and the visible controls are the fallback anyway.
    var p = playerVideo.play();
    if (p && p.catch) p.catch(function () {});
  }

  function closePlayer() {
    playerVideo.pause();
    playerVideo.removeAttribute('src');
    playerVideo.load(); // stop buffering the file we just closed
    player.className = '';
    playerLabel.textContent = '';
  }

  closeBtn.addEventListener('click', closePlayer);
  player.addEventListener('click', function (e) {
    if (e.target === player) closePlayer(); // tap the backdrop
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && player.className === 'show') closePlayer();
  });

  function render(items) {
    status.style.display = 'none';
    for (var i = 0; i < items.length; i++) {
      (function (item) {
        var tile = document.createElement('button');
        tile.className = 'tile';
        tile.setAttribute('aria-label', 'Play ' + item.label);

        var frame = document.createElement('span');
        frame.className = 'frame';

        var img = document.createElement('img');
        img.src = item.thumb;
        img.alt = '';
        // Let the browser skip offscreen thumbnails where it can; harmless
        // where unsupported.
        img.setAttribute('loading', 'lazy');
        frame.appendChild(img);

        var play = document.createElement('span');
        play.className = 'play';
        play.innerHTML = PLAY_ICON;

        var label = document.createElement('span');
        label.className = 'label';
        label.textContent = item.label;

        tile.appendChild(frame);
        tile.appendChild(play);
        tile.appendChild(label);
        tile.addEventListener('click', function () { openPlayer(item); });
        grid.appendChild(tile);
      })(items[i]);
    }
  }

  function fail(msg) {
    status.textContent = msg;
    status.style.display = 'block';
  }

  // XMLHttpRequest rather than fetch: this page exists for old browsers.
  var xhr = new XMLHttpRequest();
  xhr.open('GET', './manifest.json', true);
  xhr.onload = function () {
    if (xhr.status < 200 || xhr.status >= 300) {
      fail('Couldn’t load the video list. Please reload the page.');
      return;
    }
    try {
      var items = JSON.parse(xhr.responseText);
      if (!items.length) { fail('No videos have been published yet.'); return; }
      render(items);
    } catch (e) {
      fail('Couldn’t read the video list. Please reload the page.');
    }
  };
  xhr.onerror = function () {
    fail('Couldn’t reach the server. Check your connection and reload.');
  };
  xhr.send();
})();
</script>

</body>
</html>
